# Collecte quotidienne des actualités par société (titre + lien, source Sikafinance).
# Appelle /api/cron/refresh-news par lots de 12 sociétés (reprise via ?after=<dernier ticker>).
# Secret : CRON_SECRET (comme intraday-quotes.yml). Aucun changement de vercel.json.

name: Actualités

on:
  schedule:
    - cron: "15 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: news-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_URL: ${{ vars.PROD_URL || 'https://brwm-app.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Collecter par lots
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET absent du dépôt."
            exit 1
          fi
          after=""
          for i in 1 2 3 4 5 6 7 8; do
            url="${PROD_URL}/api/cron/refresh-news?maxTickers=12"
            if [ -n "$after" ]; then url="${url}&after=${after}"; fi
            out=$(curl --fail-with-body --silent --show-error \
              --retry 2 --retry-delay 20 --retry-all-errors \
              --connect-timeout 15 --max-time 280 \
              -H "Authorization: Bearer ${CRON_SECRET}" -H "Accept: application/json" "$url") || {
              echo "::error::Échec de la collecte (lot $i) : $out"
              exit 1
            }
            echo "$out"
            done_flag=$(echo "$out" | python3 -c 'import sys,json; d=json.load(sys.stdin)["data"]; print("1" if d["done"] else "0")')
            after=$(echo "$out" | python3 -c 'import sys,json; print(json.load(sys.stdin)["data"].get("lastTicker") or "")')
            if [ "$done_flag" = "1" ] || [ -z "$after" ]; then break; fi
          done
